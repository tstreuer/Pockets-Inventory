toes", "method": "button", "par": 0.5, "par_unit": "case", "count_unit": "case", "order_unit": "case", "pack_sun": 1, "pack_tue": 1, "pack_thu": 1}, {"uid": "item-190", "name": "Green Scallions", "method": "button", "par": 0, "par_unit": "bag", "count_unit": "bag", "order_unit": "bag", "pack_sun": 1, "pack_tue": 1, "pack_thu": 1}];
const KEY='pockets_inventory_app_v2';
let items=JSON.parse(JSON.stringify(DEFAULT_ITEMS));
let state={day:'sun',choices:{},qty:{},only:false};
try{
 const s=JSON.parse(localStorage.getItem(KEY)||'null');
 if(s){state={...state,...s};if(Array.isArray(s.items)&&s.items.length)items=s.items;}
 else {
   const old=JSON.parse(localStorage.getItem('pockets_inventory_v1')||'null');
   if(old){state.day=old.day||'sun';state.choices=old.choices||{};state.qty=old.qty||{};}
 }
}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({...state,items}));}catch(e){}}
function uidChoice(it){return state.choices[it.uid]||state.choices[it._oldPos]||''}
function hasCount(it){return Object.prototype.hasOwnProperty.call(state.qty,it.uid)&&state.qty[it.uid]!==''&&Number.isFinite(Number(state.qty[it.uid]))}
function packFor(it){return Math.max(.0001,Number(it['pack_'+state.day]||1))}
function orderQty(it){
 if(it.method!=='count')return uidChoice(it)==='Order'?1:0;
 if(!hasCount(it))return 0;
 const shortage=Math.max(0,Number(it.par||0)-Math.max(0,Number(state.qty[it.uid])));
 return shortage?Math.ceil(shortage/packFor(it)):0;
}
function selected(it){return orderQty(it)>0}
function parText(it){return it.par==null?'PAR: AS NEEDED':'PAR: '+it.par+' '+String(it.par_unit||'').toUpperCase()}
function calcHtml(it){
 if(!hasCount(it))return '<div class="calc"><strong>ENTER ON HAND</strong><div class="meta">Order quantity calculates after the count.</div></div>';
 const q=orderQty(it),on=Number(state.qty[it.uid]);
 if(!q)return '<div class="calc"><strong>NO ORDER NEEDED</strong><div class="meta">'+on+' '+it.count_unit+' on hand — at or above par.</div></div>';
 const incoming=q*packFor(it);
 return '<div class="calc order"><strong>ORDER '+q+' '+it.order_unit.toUpperCase()+(q===1?'':'S')+'</strong><div class="meta">'+on+' '+it.count_unit+' on hand + '+incoming+' '+it.count_unit+' = '+(on+incoming)+' after delivery</div></div>';
}
function renderInventory(){
 const q=document.getElementById('search').value.trim().toLowerCase();let h='',checked=0;
 items.forEach((it,i)=>{
   it._oldPos=i+1;
   if(it.method==='count'?hasCount(it):uidChoice(it))checked++;
   if(state.only&&!selected(it))return;
   if(q&&!it.name.toLowerCase().includes(q)&&!String(i+1).includes(q))return;
   const pos=i+1;
   if(it.method==='count'){
     const val=hasCount(it)?state.qty[it.uid]:'';
     h+='<div class="card"><div class="name"><span class="num">'+pos+'</span>'+esc(it.name)+'</div><div class="par">'+parText(it)+'</div><div class="meta">Enter actual '+esc(it.count_unit)+' on hand • '+packFor(it)+' '+esc(it.count_unit)+' per '+esc(it.order_unit)+'</div><div class="step-label">ON HAND</div><div class="step"><button class="minus" data-minus="'+it.uid+'">−</button><input data-input="'+it.uid+'" type="number" min="0" step=".5" value="'+val+'" placeholder="0"><button class="plus" data-plus="'+it.uid+'">+</button></div>'+calcHtml(it)+'</div>';
   }else{
     const ch=uidChoice(it);
     h+='<div class="card"><div class="name"><span class="num">'+pos+'</span>'+esc(it.name)+'</div><div class="par">'+parText(it)+'</div><div class="meta">Order by '+esc(it.order_unit)+'</div><div class="choices"><button class="choice order '+(ch==='Order'?'sel':'')+'" data-choice="'+it.uid+'" data-v="Order">ORDER</button><button class="choice no '+(ch==='No'?'sel':'')+'" data-choice="'+it.uid+'" data-v="No">NO</button></div></div>';
   }
 });
 document.getElementById('inventoryList').innerHTML=h||'<div class="empty">No matching items.</div>';
 document.getElementById('bar').style.width=Math.round(checked/Math.max(1,items.length)*100)+'%';
 document.getElementById('progress').textContent=checked+' of '+items.length+' checked';
 document.getElementById('itemCountLabel').textContent=items.length+'-item ordering walk';
 bindInventory();renderSummary();
}
function bindInventory(){
 document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.choices[b.dataset.choice]=b.dataset.v;save();renderInventory();});
 document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{const uid=b.dataset.minus,cur=Number(state.qty[uid]??0);state.qty[uid]=Math.max(0,cur-1);save();renderInventory();});
 document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{const uid=b.dataset.plus,cur=Number(state.qty[uid]??0);state.qty[uid]=cur+1;save();renderInventory();});
 document.querySelectorAll('[data-input]').forEach(inp=>inp.oninput=()=>{const uid=inp.dataset.input;if(inp.value==='')delete state.qty[uid];else state.qty[uid]=Math.max(0,Number(inp.value)||0);save();renderInventory();});
}
function renderSummary(){
 const rows=items.map((it,i)=>({it,pos:i+1,q:orderQty(it)})).filter(x=>x.q>0);
 document.getElementById('sumCount').textContent=rows.length+' item'+(rows.length===1?'':'s');
 document.getElementById('summaryRows').innerHTML=rows.length?rows.map(x=>'<div class="sumrow"><span>'+x.pos+'. '+esc(x.it.name)+'</span><strong>'+x.q+' '+esc(x.it.order_unit)+(x.q===1?'':'s')+'</strong></div>').join(''):'<div class="empty">Nothing selected to order.</div>';
}
function renderSettings(){
 const q=document.getElementById('settingsSearch').value.trim().toLowerCase();
 const filtered=items.map((it,i)=>({it,i})).filter(x=>!q||x.it.name.toLowerCase().includes(q)||String(x.i+1).includes(q));
 document.getElementById('settingsList').innerHTML=filtered.map(({it,i})=>'<div class="edit-card"><div class="edit-head"><div class="name"><span class="num">'+(i+1)+'</span>'+esc(it.name)+'</div><span class="meta">'+(it.method==='count'?'On-hand count':'ORDER / NO')+'</span></div><div class="manage-actions"><button class="manage-btn" data-edit="'+it.uid+'">Edit</button><button class="manage-btn" data-up="'+it.uid+'" '+(i===0?'disabled':'')+'>↑ Move up</button><button class="manage-btn" data-down="'+it.uid+'" '+(i===items.length-1?'disabled':'')+'>↓ Move down</button><button class="manage-btn danger" data-delete="'+it.uid+'">Delete</button></div></div>').join('')||'<div class="empty">No matching items.</div>';
 bindSettings();
}
function bindSettings(){
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(b.dataset.edit));
 document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>moveItem(b.dataset.up,-1));
 document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>moveItem(b.dataset.down,1));
 document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteItem(b.dataset.delete));
}
function moveItem(uid,delta){
 const i=items.findIndex(x=>x.uid===uid),j=i+delta;if(i<0||j<0||j>=items.length)return;
 [items[i],items[j]]=[items[j],items[i]];save();renderSettings();renderInventory();
}
function deleteItem(uid){
 const i=items.findIndex(x=>x.uid===uid);if(i<0)return;
 if(!confirm('Delete '+items[i].name+' from the inventory walk?'))return;
 delete state.choices[uid];delete state.qty[uid];items.splice(i,1);save();renderSettings();renderInventory();
}
function openEditor(uid){
 const existing=uid?items.find(x=>x.uid===uid):null;
 const it=existing?JSON.parse(JSON.stringify(existing)):{uid:'item-'+Date.now(),name:'',method:'button',par:null,par_unit:'each',count_unit:'each',order_unit:'case',pack_sun:1,pack_tue:1,pack_thu:1};
 const host=document.getElementById('modalHost');
 host.innerHTML='<div class="modal-backdrop"><div class="modal"><h2>'+(existing?'Edit Item':'Add Item')+'</h2><div class="edit-grid"><label class="full">Item name<input id="edName" value="'+escAttr(it.name)+'"></label><label>Method<select id="edMethod"><option value="button" '+(it.method==='button'?'selected':'')+'>ORDER / NO</option><option value="count" '+(it.method==='count'?'selected':'')+'>On-hand count</option></select></label><label>PAR<input id="edPar" type="number" step=".5" value="'+(it.par==null?'':it.par)+'" placeholder="blank = as needed"></label><label>PAR / count unit<input id="edParUnit" value="'+escAttr(it.par_unit||'')+'"></label><label>Order unit<input id="edOrderUnit" value="'+escAttr(it.order_unit||'case')+'"></label><label>Sunday pack<input id="edSun" type="number" step=".5" value="'+it.pack_sun+'"></label><label>Tuesday pack<input id="edTue" type="number" step=".5" value="'+it.pack_tue+'"></label><label>Thursday pack<input id="edThu" type="number" step=".5" value="'+it.pack_thu+'"></label>'+(existing?'':'<label class="full">Insert at position<input id="edPosition" type="number" min="1" max="'+(items.length+1)+'" value="'+(items.length+1)+'"></label>')+'</div><div class="modal-actions"><button id="edCancel" class="tool">Cancel</button><button id="edSave" class="primary">Save</button></div></div></div>';
 document.getElementById('edCancel').onclick=()=>host.innerHTML='';
 document.getElementById('edSave').onclick=()=>{
   const name=document.getElementById('edName').value.trim();if(!name){alert('Enter an item name.');return;}
   it.name=name;it.method=document.getElementById('edMethod').value;
   const pv=document.getElementById('edPar').value;it.par=pv===''?null:Number(pv);
   it.par_unit=document.getElementById('edParUnit').value.trim()||'each';
   it.count_unit=it.par_unit;
   it.order_unit=document.getElementById('edOrderUnit').value.trim()||'case';
   it.pack_sun=Math.max(.0001,Number(document.getElementById('edSun').value)||1);
   it.pack_tue=Math.max(.0001,Number(document.getElementById('edTue').value)||1);
   it.pack_thu=Math.max(.0001,Number(document.getElementById('edThu').value)||1);
   if(existing){Object.assign(existing,it);}
   else{const pos=Math.min(items.length+1,Math.max(1,Number(document.getElementById('edPosition').value)||items.length+1));items.splice(pos-1,0,it);}
   host.innerHTML='';save();renderSettings();renderInventory();
 };
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function escAttr(s){return esc(s);}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));['inventory','summary','settings'].forEach(v=>document.getElementById(v+'View').classList.toggle('hidden',v!==b.dataset.view));if(b.dataset.view==='settings')renderSettings();if(b.dataset.view==='summary')renderSummary();});
document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{state.day=b.dataset.day;document.querySelectorAll('.day').forEach(x=>x.classList.toggle('active',x===b));save();renderInventory();});
document.getElementById('search').oninput=renderInventory;
document.getElementById('only').onclick=()=>{state.only=!state.only;document.getElementById('only').textContent=state.only?'Show all':'Order only';save();renderInventory();};
document.getElementById('resetDay').onclick=()=>{if(confirm('Clear all counts and ORDER/NO choices?')){state.choices={};state.qty={};save();renderInventory();}};
document.getElementById('settingsSearch').oninput=renderSettings;
document.getElementById('addItem').onclick=()=>openEditor(null);
document.querySelectorAll('.day').forEach(x=>x.classList.toggle('active',x.dataset.day===state.day));
renderInventory();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./service-worker.js').catch(()=>{});}
